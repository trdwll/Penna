[package]
name = "penna"
version = "0.10.0"
description = "Local-first Markdown knowledge base with Git sync"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "penna_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
git2 = { version = "0.21.0", features = ["https", "ssh"] }
notify-debouncer-mini = "0.7.0"
walkdir = "2.5.0"
thiserror = "2.0.21"
tauri-plugin-dialog = "2.8.3"
tokio = { version = "1.53.3", default-features = false, features = ["rt", "sync"] }
trash = "5.2"

# PDF export prints through WebView2 itself; these match the versions Tauri uses.
[target.'cfg(windows)'.dependencies]
webview2-com = "=0.39.1"
windows-core = "=0.62.2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
